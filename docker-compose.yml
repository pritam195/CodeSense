services:
  backend:
    build: ./backend
    environment:
      CODESENSE_DATA_DIR: /app/data
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    volumes:
      - codesense-data:/app/data

  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  codesense-data:

