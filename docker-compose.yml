services:
  backend:
    build: ./backend
    environment:
      CODESENSE_DATA_DIR: /app/data
      CORS_ORIGINS: http://localhost:5174
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
    ports:
      - "8000:8000"
    volumes:
      - codesense-data:/app/data
    depends_on:
      - neo4j

  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5174:5173"
    depends_on:
      - backend

  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/password
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data

volumes:
  codesense-data:
  neo4j-data:

